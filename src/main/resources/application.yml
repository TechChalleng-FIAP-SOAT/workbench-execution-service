spring:
  application:
    name: execution-service
  # Mais de uma thread para os @Scheduled: o consumidor SQS faz long polling e não pode
  # dividir a única thread padrão com os outros jobs (timeout da Saga, consulta ao gateway).
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  # Spring Boot 4: a conexão saiu de spring.data.mongodb.* para spring.mongodb.*
  # (as chaves antigas são ignoradas — o serviço cairia sempre em localhost).
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/execution}
    representation:
      # Necessário para persistir campos UUID (ex.: serviceOrderId) de forma portável.
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
      representation:
        # Valores monetários e quantidades como Decimal128 (número decimal exato do MongoDB).
        # Como texto, "10" < "9" numa comparação, e consultas como "estoque baixo" erravam.
        big-decimal: decimal128

jwt:
  # Chave PÚBLICA da Lambda de autenticação (RS256), Base64 do DER. Sem padrão: sem ela não sobe.
  public-key: ${JWT_PUBLIC_KEY}

logging:
  file:
    name: /tmp/app.log
  level:
    root: INFO

management:
  metrics:
    tags:
      service: ${DD_SERVICE:${spring.application.name}}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:local}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  datadog:
    metrics:
      export:
        enabled: ${DD_METRICS_ENABLED:false}
        api-key: ${DD_API_KEY:}
        uri: ${DD_METRICS_URI:https://api.datadoghq.com}
        step: 1m

server:
  port: 8080

# Mensageria (Saga) — mesma convenção do os-service.
messaging:
  enabled: ${MESSAGING_ENABLED:false}
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:}
  execution-events-topic-arn: ${EXECUTION_EVENTS_TOPIC_ARN:}
  commands-queue-url: ${EXECUTION_COMMANDS_QUEUE_URL:}
