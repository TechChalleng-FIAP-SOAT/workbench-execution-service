apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: execution-service
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: execution-service
  # Banco próprio (MongoDB). Ajuste host/credenciais por ambiente.
  MONGODB_URI: mongodb://execution-mongo:27017/execution
  DD_ENV: "local"
  DD_SERVICE: "execution-service"
  DD_VERSION: "1.0.0"
  DD_METRICS_ENABLED: "true"
  DD_METRICS_URI: "https://api.datadoghq.com"
