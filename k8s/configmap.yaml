apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: execution-service
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: execution-service
  # MONGODB_URI é injetado via Secret (k8s/secret.yaml) — a connection string do
  # Atlas contém credenciais, então não fica em ConfigMap.
  DD_ENV: "local"
  DD_SERVICE: "execution-service"
  DD_VERSION: "1.0.0"
  DD_METRICS_ENABLED: "true"
  DD_METRICS_URI: "https://api.datadoghq.com"
