apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: execution-service
  labels:
    app: execution-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
        tags.datadoghq.com/service: execution-service
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        admission.datadoghq.com/java-lib.version: "latest"
        ad.datadoghq.com/execution-service.logs: '[{"source":"java","service":"execution-service"}]'
    spec:
      containers:
        - name: execution-service
          image: REPLACE_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: execution-service-config
            - secretRef:
                name: execution-service-secret
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_LOGS_INJECTION
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
  namespace: execution-service
  labels:
    app: execution-service
spec:
  type: LoadBalancer
  selector:
    app: execution-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# MongoDB in-cluster — SOMENTE para ambiente local/dev.
# Em produção, usar MongoDB gerenciado (ex.: Atlas) e apontar MONGODB_URI via secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-mongo
  namespace: execution-service
  labels:
    app: execution-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-mongo
  template:
    metadata:
      labels:
        app: execution-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          # Replica set de 1 nó para habilitar transações multi-documento.
          command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
---
apiVersion: v1
kind: Service
metadata:
  name: execution-mongo
  namespace: execution-service
spec:
  selector:
    app: execution-mongo
  ports:
    - port: 27017
      targetPort: 27017
